name: Active desktop and backend gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  shared-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:web
      - run: pnpm db:start
      - run: pnpm test:db
      - run: pnpm test:api
      - run: pnpm db:stop
        if: always()
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build:desktop
      - run: pnpm e2e:desktop
      - run: pnpm --filter @fasteners/desktop package
      - run: pnpm e2e:desktop:packaged
      - run: pnpm release:checksums
      - uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-sample-build
          path: |
            apps/desktop/release/*Setup*.exe
            apps/desktop/release/SHA256SUMS.txt
