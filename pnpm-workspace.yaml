packages:
  - apps/*
  - packages/*
  - '!apps/mobile'
  - '!packages/sqlite-mobile'
  - '!packages/ui-native'
allowBuilds:
  better-sqlite3: true
  electron: true
  electron-winstaller: false
  esbuild: true
  supabase: true
minimumReleaseAgeExclude:
